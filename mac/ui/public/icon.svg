<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#16231C"/>
      <stop offset="1" stop-color="#0A0E0C"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FC58C"/>
      <stop offset="1" stop-color="#1C7A52"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- a sun resting on the baseline, inside a thin orbit -->
  <circle cx="256" cy="276" r="156" fill="none" stroke="#2A3D33" stroke-width="6"/>
  <path d="M164 276 A92 92 0 0 1 348 276 Z" fill="url(#sun)"/>
  <line x1="92" y1="276" x2="420" y2="276" stroke="#C49A3A" stroke-width="10" stroke-linecap="round"/>
  <!-- its reflection, fading in steps -->
  <line x1="180" y1="314" x2="332" y2="314" stroke="#26A870" stroke-width="8" stroke-linecap="round" opacity=".55"/>
  <line x1="212" y1="346" x2="300" y2="346" stroke="#26A870" stroke-width="8" stroke-linecap="round" opacity=".32"/>
  <line x1="240" y1="378" x2="272" y2="378" stroke="#26A870" stroke-width="8" stroke-linecap="round" opacity=".18"/>
</svg>
